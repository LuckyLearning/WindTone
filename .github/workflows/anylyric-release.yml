name: AnyLyric Release

# AnyLyric 独立的发版流水线。
#
# 为什么单独一份（不复用 android-release.yml）：
#  · 版本线独立（0.x），与 WindTone 的 1.2.x 互不干涉，tag 前缀也必须分开；
#  · 产物只有一个通用包（不做 abiSplits），不产出 mapping 之外的额外资产；
#  · 只需要 :anylyric 一个 module，构建分钟数远低于 WindTone。
#
# tag 前缀用 `anylyric-v*` 而不是 `v*`：`v*` 归 WindTone，两者不能互相触发。
#
# 发版：bash scripts/release-anylyric.sh patch
# 手动：Actions → AnyLyric Release → Run workflow（只构建，不发布）
on:
  push:
    tags:
      - 'anylyric-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: '仅构建，不发布（占位开关；正式发版请推 anylyric-v* tag）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 同一 tag / 分支重复触发时取消旧的；公共仓库那一步另有跨 workflow 的串行锁（见 job 级 concurrency）
concurrency:
  group: anylyric-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release AnyLyric
    # 公共仓库是「孤立提交 + force push 快照」的写入方式，与 WindTone 发布 job 并发会互相覆盖。
    # 两个 workflow 共用这个 group，保证同一时刻只有一个在写公共仓库。
    concurrency:
      group: public-release-repo
      cancel-in-progress: false
    # 固定镜像：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26，避免构建环境被静默替换
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        # v3 的 packages 默认值是 'tools platform-tools'，而 tools 已从 SDK 仓库下架，
        # 会让 sdkmanager 以退出码 1 直接失败。这里只保留 platform-tools。
        with:
          packages: 'platform-tools'

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      # ---------------------------------------------------------------- 版本号
      # 版本号在 anylyric/build.gradle.kts 顶部：anyLyricVersionName / anyLyricVersionCode
      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -oP 'anyLyricVersionName\s*=\s*"\K[^"]+' anylyric/build.gradle.kts | head -1)
          CODE=$(grep -oP 'anyLyricVersionCode\s*=\s*\K[0-9]+' anylyric/build.gradle.kts | head -1)
          if [ -z "$VERSION" ] || [ -z "$CODE" ]; then
            echo "::error::无法从 anylyric/build.gradle.kts 读到版本号"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：AnyLyric v$VERSION (versionCode $CODE)"

      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#anylyric-v}"
          FILE_VERSION="${{ steps.ver.outputs.name }}"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag($TAG_VERSION) 与 anylyric/build.gradle.kts 的 versionName($FILE_VERSION) 不一致"
            exit 1
          fi
          echo "tag 与 versionName 一致：anylyric-v$FILE_VERSION"

      # ---------------------------------------------------------------- 签名
      # 与 WindTone 同一套密钥（同一开发者、同一分发渠道），因此在同一台车机上可以互相覆盖升级。
      - name: 准备签名密钥
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::未配置 secret KEYSTORE_BASE64 —— 无签名包无法覆盖安装，发版中止"
            exit 1
          fi
          JKS="$RUNNER_TEMP/anylyric-release.jks"
          # 解码命令与 android-release.yml 完全一致（那条已经在实际发版里验证过）。
          # 刻意不用 `openssl base64 -d`：遇到非法字符它会**静默跳过**，
          # 把「解不出来」变成「解出一个坏文件」，最后只在签名阶段报
          # `Tag number over 30 is not supported`，看不出根因在解码。
          # GNU base64 -d 会对非法输入直接失败，错在哪一眼可见。
          echo "$KEYSTORE_BASE64" | base64 -d > "$JKS"
          SIZE=$(stat -c%s "$JKS")
          MAGIC=$(od -An -tx1 -N4 "$JKS" | tr -d ' \n')
          echo "解码结果：${SIZE} 字节，文件头 ${MAGIC}"
          case "$MAGIC" in
            feedfeed*)          echo "格式：JKS" ;;
            3081*|3082*|30*)    echo "格式：PKCS12(DER)" ;;
            *)
              echo "::error::解码后不是 keystore（文件头 $MAGIC，${SIZE} 字节）—— 请重新生成 secret KEYSTORE_BASE64"
              exit 1 ;;
          esac
          echo "path=$JKS" >> "$GITHUB_OUTPUT"
          echo "::notice::已载入仓库签名密钥（${SIZE} 字节）"

      # ---------------------------------------------------------------- 质量闸
      # 与 WindTone「发版不跑单测」不同：:anylyric 的 JVM 单测只有几十项、
      # 几秒跑完，成本可忽略，而它守的是歌词解析/判因这些纯逻辑，值得每次把关。
      - name: 单元测试
        run: ./gradlew :anylyric:testDebugUnitTest --stacktrace

      - name: Lint（Error 级门禁）
        run: ./gradlew :anylyric:lintDebug --stacktrace

      - name: 校验 lint 无 Error
        run: |
          report=anylyric/build/reports/lint-results-debug.xml
          if [ ! -f "$report" ]; then
            echo "::error::未生成 lint 报告：$report"
            exit 1
          fi
          errors=$(grep -c 'severity="Error"' "$report" || true)
          echo "lint Error 级数量：$errors"
          if [ "$errors" -ne 0 ]; then
            grep -B1 -A3 'severity="Error"' "$report" | head -100
            echo "::error::lint 存在 $errors 条 Error，发版中止"
            exit 1
          fi

      # ---------------------------------------------------------------- 构建
      - name: 构建 Release 包
        env:
          WINDTONE_KEYSTORE: ${{ steps.ks.outputs.path }}
          WINDTONE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WINDTONE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WINDTONE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :anylyric:assembleRelease --stacktrace

      - name: 收集产物并计算校验值
        id: apk
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          mkdir -p dist
          shopt -s nullglob
          SRCS=(anylyric/build/outputs/apk/release/*.apk)
          if [ ${#SRCS[@]} -eq 0 ]; then
            echo "::error::未找到 AnyLyric Release APK 产物"
            exit 1
          fi
          for f in "${SRCS[@]}"; do cp "$f" dist/; done

          {
            echo "### 本次产物"
            echo
            echo "| 文件 | 大小 | SHA-256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.apk; do
            n=$(basename "$f")
            b=$(stat -c%s "$f")
            s=$(sha256sum "$f" | cut -d' ' -f1)
            echo "| \`$n\` | $b 字节 | \`$s\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "$n  $b  $s"
          done

          # AnyLyric 开了 R8（isMinifyEnabled = true），混淆后的崩溃栈要靠这份 mapping 还原
          MAP="anylyric/build/outputs/mapping/release/mapping.txt"
          if [ -f "$MAP" ]; then
            cp "$MAP" "dist/mapping-anylyric-v${VERSION_NAME}.txt"
            echo "mapping 已归档：mapping-anylyric-v${VERSION_NAME}.txt"
          else
            echo "::warning::未找到 mapping.txt —— 开了混淆却没产物，崩溃栈将无法还原"
          fi

      # 归档失败不挡发版（artifact 配额曾被历史产物占满，见 android-release.yml 同名步骤注释）
      - name: 上传构建产物（归档，失败不阻塞发版）
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AnyLyric-v${{ steps.ver.outputs.name }}
          path: |
            dist/*.apk
            dist/mapping-anylyric-v*.txt
          if-no-files-found: error
          retention-days: 7

      # ---------------------------------------------------------------- 发布说明
      # 正文来自固定模板 .github/release-notes/anylyric-template.md，只替换版本号占位符
      - name: 组装 Release 说明
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          OUT="$RUNNER_TEMP/release-body.md"
          bash scripts/render-release-notes.sh \
            --gradle anylyric/build.gradle.kts \
            --template .github/release-notes/anylyric-template.md \
            --version-key anyLyricVersionName \
            --code-key anyLyricVersionCode \
            "$VERSION" "$CODE" "$OUT"
          cat "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- 发布
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AnyLyric v${{ steps.ver.outputs.name }}
          files: |
            dist/*.apk
            dist/mapping-anylyric-v*.txt
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true

      # ---------------------------------------------------------------- 公共分发仓库
      # 与 WindTone 同一个公共仓库，目录是 AnyLyric/（latest.json + v<版本>/）。
      # 源码仓库私有，公共仓库必须能匿名读，否则用户拿不到安装包。
      - name: 发布到公共分发仓库（保留最近 5 个版本）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          VERSION: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
          DIST_DIR: dist
          APP_DIR: AnyLyric
          # latest.json 里要写对最低系统版本（WindTone 24 / AnyLyric 31）
          MIN_SDK: '31'
        run: |
          if [ -z "$RELEASE_REPO_TOKEN" ]; then
            echo "::error::未配置 secret RELEASE_REPO_TOKEN —— 公共仓库没有本次版本，用户下不到安装包"
            exit 1
          fi
          bash scripts/publish-release-repo.sh
