name: Android CI

# 主干与 PR 的快速校验：跑单测 + 出一个 debug 包，确保任何提交都能编译通过
# 2026-10-31 CI 提速：paths-ignore 避免纯文档触发；一次 Gradle 跑完 test/lint/assemble
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/pages.yml'
      - '.github/release-notes/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/pages.yml'
      - '.github/release-notes/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    # 固定镜像：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26，避免构建环境被静默替换
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        # v3 的 packages 默认值是 'tools platform-tools'，而 tools 已从 SDK 仓库下架，
        # 会让 sdkmanager 以退出码 1 直接失败。这里只保留 platform-tools。
        with:
          packages: 'platform-tools'

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      # 一次 Gradle 调用：共用配置与编译；随后仍按 lint XML 做 Error 门禁
      - name: 单测 + Lint + Debug 包
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      # 注意：app/build.gradle.kts 里 lint { abortOnError = false }，所以
      # “构建成功 ≠ lint 干净”。这里显式解析 XML，把 Error 级作为合入门禁：
      # 本地保留不阻断（发版不受影响），CI 上不允许 Error 级新增。
      - name: Lint（Error 级门禁）
        run: |
          report=app/build/reports/lint-results-debug.xml
          if [ ! -f "$report" ]; then
            echo "::error::未生成 lint 报告：$report"
            exit 1
          fi
          errors=$(grep -c 'severity="Error"' "$report" || true)
          echo "lint Error 级数量：$errors"
          if [ "$errors" -ne 0 ]; then
            grep -B1 -A3 'severity="Error"' "$report" | head -100
            echo "::error::lint 存在 $errors 个 Error，请先修复（构建成功不等于 lint 干净）"
            exit 1
          fi

      # ⚠️ 2026-10-30：账号 artifact 配额已满，上传会报 "Artifact storage quota has been hit"。
      # 这三处产物都只是排障用（Debug 包 / 测试报告 / lint 报告），**不该让 CI 变红**。
      # 因此统一 continue-on-error：有配额就传，没配额也不影响「代码是否通过」的判断。
      - name: 上传 Debug 包
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: WindTone-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: 汇总测试结果
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 lint 报告
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
