name: Deploy docs to GitHub Pages

# docs/ 既是文档源也是发布目录。
# 只在 docs/ 或本工作流有改动时自动触发；也可手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建文档站
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 用 GITHUB_TOKEN（permissions.pages: write）尝试自动启用 Pages（enablement: true）。
      # 若仍失败，请到 Settings → Pages → Build and deployment → Source 选「GitHub Actions」，
      # 然后 Actions → Deploy docs to GitHub Pages → Run workflow。
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true


      - name: Jekyll 构建
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: 部署到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
