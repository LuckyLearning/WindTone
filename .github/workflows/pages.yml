name: Deploy docs to GitHub Pages

# docs/ 既是文档源也是发布目录。
# 只在 docs/ 或本工作流有改动时自动触发；也可手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建文档站
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 首次必须在仓库 Settings → Pages → Build and deployment → Source
      # 选「GitHub Actions」。未启用时本步会 404 失败（PAT/GITHUB_TOKEN 均无法代开）。
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: Jekyll 构建
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: 部署到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
