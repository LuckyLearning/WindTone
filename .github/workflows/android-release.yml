name: Release APK

# 打一个 v* 标签即可自动出包并创建 GitHub Release；
# 也可以在 Actions 页面手动触发（手动触发只构建、不发布）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: '是否用当前版本号创建 Release（勾选后需已有对应 tag，一般推荐直接用打 tag 的方式）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    # 固定镜像：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26，避免构建环境被静默替换
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        # v3 的 packages 默认值是 'tools platform-tools'，而 tools 已从 SDK 仓库下架，
        # 会让 sdkmanager 以退出码 1 直接失败。这里只保留 platform-tools。
        with:
          packages: 'platform-tools'

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      # ---------------------------------------------------------------- 版本号
      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -oP '(?:appVersionName|versionName)\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP '(?:appVersionCode|versionCode)\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：v$VERSION (versionCode $CODE)"

      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="${{ steps.ver.outputs.name }}"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag($TAG_VERSION) 与 build.gradle.kts 的 versionName($FILE_VERSION) 不一致；"
            echo "::error::否则应用内更新会判断错误。请先修改 versionName 再打 tag。"
            exit 1
          fi
          echo "tag 与 versionName 一致：v$FILE_VERSION"

      # ---------------------------------------------------------------- 签名
      - name: 准备签名密钥
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/windtone-release.jks"
            echo "path=$RUNNER_TEMP/windtone-release.jks" >> "$GITHUB_OUTPUT"
            echo "::notice::已载入仓库签名密钥"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secret KEYSTORE_BASE64，本次产物将不带签名，无法直接覆盖安装"
          fi

      # ---------------------------------------------------------------- 构建
      # 一次 Gradle：单测 + Release 包（仍保留发版前单测门禁，只省二次配置）
      - name: 单测 + 构建 Release 包
        env:
          WINDTONE_KEYSTORE: ${{ steps.ks.outputs.path }}
          WINDTONE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WINDTONE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WINDTONE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 百度网盘开放平台凭据（v1.1.39）：构建脚本从环境变量读，
          # 未配置时构建仍能成功，只是应用里的网盘入口会提示「未配置凭据」
          BAIDU_APP_KEY: ${{ secrets.BAIDU_APP_KEY }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
        # -PabiSplits=true：按 ABI 分包并额外产出 universal 包（本地开发默认关闭）
        run: ./gradlew testDebugUnitTest assembleRelease -PabiSplits=true --stacktrace

      - name: 收集产物并计算校验值
        id: apk
        env:
          # mapping 归档要用版本号命名（mapping 与 APK 一一对应）
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          mkdir -p dist
          shopt -s nullglob
          SRCS=(app/build/outputs/apk/release/*.apk)
          if [ ${#SRCS[@]} -eq 0 ]; then
            echo "::error::未找到 Release APK 产物"
            exit 1
          fi
          for f in "${SRCS[@]}"; do cp "$f" dist/; done
          if ! ls dist/*universal*.apk >/dev/null 2>&1; then
            echo "::warning::没有找到 universal 包，请检查 abiSplits 配置"
          fi
          {
            echo "### 本次产物"
            echo
            echo "| 文件 | 大小 | SHA-256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.apk; do
            n=$(basename "$f")
            b=$(stat -c%s "$f")
            s=$(sha256sum "$f" | cut -d' ' -f1)
            echo "| \`$n\` | $b 字节 | \`$s\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "$n  $b  $s"
          done
          echo "count=$(ls dist/*.apk | wc -l)" >> "$GITHUB_OUTPUT"

          # v1.1.97：混淆后的崩溃栈必须靠这份 mapping 还原，**与 APK 同等重要**。
          # 命名带版本号——mapping 与 APK 一一对应，混用会还原出错误的名字。
          MAP="app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$MAP" ]; then
            cp "$MAP" "dist/mapping-v${VERSION_NAME}.txt"
            echo "mapping 已归档：mapping-v${VERSION_NAME}.txt（$(stat -c%s "dist/mapping-v${VERSION_NAME}.txt") 字节）"
          else
            echo "::error::未找到 mapping.txt —— 开了混淆却没有它，线上崩溃将无法还原"
            exit 1
          fi

      # ⚠️ 这一步只是「归档」，**Release 不依赖它**（下面同一个 job 直接用 dist/*.apk 发布）。
      # 2026-10-30 事故：账号的 artifact 存储配额被历史产物占满（100+ 个、约 540MB），
      # upload-artifact 报 "Artifact storage quota has been hit" 直接把这个 job 拖红，
      # 于是后面的 Release 与公共分发仓库更新一步都没跑 —— 版本号进了 main，却没出包。
      # 所以改成 continue-on-error：配额正常时照常归档，配额满了也不挡发版。
      # 保留期同时从 90 天收到 7 天，少占配额（Release 资产本身就是长期归档）。
      - name: 上传构建产物（归档，失败不阻塞发版）
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: WindTone-v${{ steps.ver.outputs.name }}
          path: |
            dist/*.apk
            dist/mapping-v*.txt
          if-no-files-found: error
          retention-days: 7

      # ---------------------------------------------------------------- 发布说明
      # 正文来自**固定模板** `.github/release-notes/template.md`，
      # 发版时只替换 {version} / {version_code} / {date}，不需要每个版本写文案。
      # 渲染逻辑在 scripts/render-release-notes.sh 里，与本地 release.sh 共用同一份。
      - name: 组装 Release 说明
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          OUT="$RUNNER_TEMP/release-body.md"
          bash scripts/render-release-notes.sh "$VERSION" "$CODE" "$OUT"
          cat "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- 发布
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 听风 WindTone ${{ github.ref_name }}
          files: |
            dist/*.apk
            dist/mapping-v*.txt
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true

      # ---------------------------------------------------------------- 公共分发仓库
      # 源码仓库已私有，匿名用户拿不到这里 Release 的资产，而应用内更新必须能匿名读。
      # 因此每个版本再往公共仓库 LuckyLearning/Release 发一份（按 软件/版本 分目录，
      # 只保留最近 5 个版本），应用内更新读的就是那里的 latest.json。
      - name: 发布到公共分发仓库（保留最近 5 个版本）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          VERSION: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
          DIST_DIR: dist
        run: |
          if [ -z "$RELEASE_REPO_TOKEN" ]; then
            echo "::error::未配置 secret RELEASE_REPO_TOKEN —— 公共仓库没有本次版本，应用内更新会停在旧版本"
            exit 1
          fi
          bash scripts/publish-release-repo.sh
