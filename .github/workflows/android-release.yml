name: Release APK

# 打一个 v* 标签即可自动出包并创建 GitHub Release；
# 也可以在 Actions 页面手动触发（手动触发只构建、不发布）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: '是否用当前版本号创建 Release（勾选后需已有对应 tag，一般推荐直接用打 tag 的方式）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    # 固定镜像：ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26，避免构建环境被静默替换
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        # v3 的 packages 默认值是 'tools platform-tools'，而 tools 已从 SDK 仓库下架，
        # 会让 sdkmanager 以退出码 1 直接失败。这里只保留 platform-tools。
        with:
          packages: 'platform-tools'

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------------------------------- 版本号
      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -oP '(?:appVersionName|versionName)\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP '(?:appVersionCode|versionCode)\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：v$VERSION (versionCode $CODE)"

      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="${{ steps.ver.outputs.name }}"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag($TAG_VERSION) 与 build.gradle.kts 的 versionName($FILE_VERSION) 不一致；"
            echo "::error::否则应用内更新会判断错误。请先修改 versionName 再打 tag。"
            exit 1
          fi
          echo "tag 与 versionName 一致：v$FILE_VERSION"

      # ---------------------------------------------------------------- 签名
      - name: 准备签名密钥
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/windtone-release.jks"
            echo "path=$RUNNER_TEMP/windtone-release.jks" >> "$GITHUB_OUTPUT"
            echo "::notice::已载入仓库签名密钥"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secret KEYSTORE_BASE64，本次产物将不带签名，无法直接覆盖安装"
          fi

      # ---------------------------------------------------------------- 构建
      - name: 单元测试
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: 构建 Release 包
        env:
          WINDTONE_KEYSTORE: ${{ steps.ks.outputs.path }}
          WINDTONE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WINDTONE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WINDTONE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # -PabiSplits=true：按 ABI 分包并额外产出 universal 包（本地开发默认关闭）
        run: ./gradlew assembleRelease -PabiSplits=true --stacktrace

      - name: 收集产物并计算校验值
        id: apk
        run: |
          mkdir -p dist
          shopt -s nullglob
          SRCS=(app/build/outputs/apk/release/*.apk)
          if [ ${#SRCS[@]} -eq 0 ]; then
            echo "::error::未找到 Release APK 产物"
            exit 1
          fi
          for f in "${SRCS[@]}"; do cp "$f" dist/; done
          if ! ls dist/*universal*.apk >/dev/null 2>&1; then
            echo "::warning::没有找到 universal 包，请检查 abiSplits 配置"
          fi
          {
            echo "### 本次产物"
            echo
            echo "| 文件 | 大小 | SHA-256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.apk; do
            n=$(basename "$f")
            b=$(stat -c%s "$f")
            s=$(sha256sum "$f" | cut -d' ' -f1)
            echo "| \`$n\` | $b 字节 | \`$s\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "$n  $b  $s"
          done
          echo "count=$(ls dist/*.apk | wc -l)" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WindTone-v${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------------- 发布说明
      - name: 组装 Release 说明
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          OUT="$RUNNER_TEMP/release-body.md"
          NOTES=".github/release-notes/v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            cat "$NOTES" > "$OUT"
            echo "::notice::使用手写说明 $NOTES"
          else
            # 没写说明时的兜底：用 git log 生成变更列表，并明确提示
            PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            {
              echo "WindTone ${VERSION}。"
              echo
              echo "# 变更"
              echo
              if [ -n "$PREV" ]; then
                git log --pretty=format:'- %s' "$PREV..$GITHUB_REF_NAME" | grep -v '^- release:' || true
              else
                git log -n 20 --pretty=format:'- %s' "$GITHUB_REF_NAME"
              fi
              echo
              echo
              echo "**适用设备**：Android 7.0（API 24）及以上；手机与车机通用。"
              echo
              echo "**安装**：下载与设备架构匹配的包（不确定就下 universal），直接覆盖安装，歌单、收藏、播放统计全部保留。"
              echo
              echo "**升级**：也可在应用内「设置 → 更新 → 检查更新」一键升级。"
            } > "$OUT"
            echo "::warning::未找到 .github/release-notes/v${VERSION}.md，已用 git log 生成兜底说明"
          fi
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          cat "$OUT"

      # ---------------------------------------------------------------- 发布
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 听风 WindTone ${{ github.ref_name }}
          files: dist/*.apk
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true
