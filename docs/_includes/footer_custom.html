<script>
(function () {
  function preferred() {
    try {
      var stored = localStorage.getItem('windtone-theme');
      if (stored === 'dark' || stored === 'light') return stored;
    } catch (e) {}
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function apply(theme) {
    if (typeof jtd === 'undefined' || !jtd.setTheme) return;
    jtd.setTheme(theme);
    var btn = document.querySelector('.js-wt-theme');
    if (btn) btn.textContent = theme === 'dark' ? '浅色' : '深色';
  }
  function init() {
    var theme = preferred();
    apply(theme);
    var btn = document.querySelector('.js-wt-theme');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var next = (typeof jtd !== 'undefined' && jtd.getTheme && jtd.getTheme() === 'dark') ? 'light' : 'dark';
      try { localStorage.setItem('windtone-theme', next); } catch (e) {}
      apply(next);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
