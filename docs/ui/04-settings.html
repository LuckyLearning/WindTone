<script>
/* 主题必须在样式之前定位，避免首帧闪错色：
   1) 用户手动切过 → 用记住的选择（localStorage）
   2) 没切过 → 跟随系统 prefers-color-scheme（App 也是跟随系统主题） */
(function(){
  try{
    var saved=localStorage.getItem('wt-ui-theme');
    var theme=saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme',theme);
  }catch(e){
    document.documentElement.setAttribute('data-theme','dark');
  }
})();
</script>

  <p class="note"><b>分层原则（v1.1.3 二次重构）</b>：主页面<b>只放二级分类入口卡</b>，一张卡一个分类——左侧<b>语义图标</b>（40dp 圆角 12 容器、secondaryContainer 底）+ 分类名 + 一行摘要 + 右箭头，<b>摘要把子页里最重要的状态前置</b>（「格式与容量 · 过滤 &lt; 60 秒」「v1.0.6」「速度 1.00x」），不进子页就能看到大概。<br>
  &nbsp;&nbsp;v1.0.7 曾把主页压到「外观 / 播放 / 歌词三组平铺 + 三个子页入口」（约 1.3 屏）；但悬浮歌词五个外观选项加入后，「歌词」一组独占两屏，主页又开始长回去——本次把 <b>外观 / 播放 / 歌词</b> 三组也各自下沉成子页，主页回到<b>一屏六张卡</b>，任何设置最多两层直达。<br>
  &nbsp;&nbsp;六个分类的归属：①<b>外观</b>——主题跟随封面取色、车载模式；②<b>播放</b>——默认播放速度、变调、<b>打开应用继续上次播放</b>、跳过静音、均衡器与音效；③<b>歌词</b>——歌词字号、桌面悬浮歌词及其外观选项；④<b>音乐库</b>——短音频过滤（一次性配置）；⑤<b>更新</b>——检查更新 / 自动检查 / 下载线路；⑥<b>关于与诊断</b>——播放统计、崩溃日志、版本与隐私。<br>
  <b>设置页从底部滑入覆盖全屏</b>（不是新 Activity）；子页是同一个 <code>SettingsScreen</code> 内部的页面状态（<code>SettingsPage</code> 枚举），<b>不新建 Activity、不引入导航库</b>；子页里按系统返回键先回主页面，回主页后再按才关闭设置页。<br>
  <b>分类入口卡 = 图标 + 摘要 + 右箭头</b>：v1.0.7 起「全 App 不存在 chevron」的规范放宽为「只有 ActionRow 能带 chevron」；v1.1.3 起再放宽一档——<b>设置主页的二级分类入口卡（<code>CategoryRow</code>）也带 chevron 和左侧图标</b>（参考通用播放器设置主页的二级菜单结构），其余位置不变：<code>OptionRow</code>（弹层行）依旧左侧图标 + 选中 ✓、无箭头；子页内的 <code>ActionRow</code> 依旧左侧无图标、箭头只给「点开会进入另一个界面」的行（子页入口、打开弹层 / 弹窗的行），就地执行动作（「检查更新」）或就地展开（「查看日志」）的行不加。<br>
  <b>子页入口行与分类卡的区别</b>：子页里的 <code>ActionRow</code>（如「均衡器与音效」「过滤短音频」）是<b>某一类设置里的一条</b>，无图标；主页的 <code>CategoryRow</code> 是<b>一整类设置的门面</b>，带图标 + 摘要——两层信息密度不同，不会混淆。<br>
  <b>v1.1.4：每项都能恢复默认</b>。凡是「能调的地方」，行尾都会在<b>当前值偏离出厂默认时</b>出现一枚 <code>.rst</code>（↺，18dp、<code>onSurfaceVariant</code> 色），点一下写回 <code>SettingsDefaults</code> 里那个常量。<br>
  &nbsp;&nbsp;<b>只在偏离时出现</b>：一行都没动过却挂着按钮，用户会以为「还得点一下才算生效」，等于把默认状态本身渲染成了一个疑问。反过来，默认值<b>不能</b>只写在 getter 里——恢复默认写回的那份和首次安装拿到的那份对不上时，不报错、不崩溃，只是两类用户行为不一致（由 <code>SettingsDefaultsTest</code> 钉住）。<br>
  &nbsp;&nbsp;<b>↺ 嵌在整行 clickable 里</b>：Compose 的点击手势由最内层消费，所以点 ↺ 只复位、不会顺带打开这一行该进的那个界面（<code>SettingsScreenTest</code> 有专门一条守着）。<br>
  &nbsp;&nbsp;不复位的东西有两处：<b>「均衡器与音效」那一行本身</b>（它只是个弹层入口，真正的复位按钮在弹层标题行里，见 ⑲）与<b>悬浮歌词的位置</b>（属于「调整位置」那条路径，自检里有「重置位置并预览」）。</p>

  <b>宽度滑块改完立刻给一次 6 秒预览</b>。<br>
  <b>v1.1.22 起全屏这一档在 App 内不画</b>：整屏浮层不再压在设置页上（含「调整位置」与改完配置的 6 秒预览），宽度 / 水平位置下方改为一块 16:9 缩略示意图 —— 面板宽度、左右位置、底部 Dock 让位都按当前值实时绘制，实际效果退到桌面看。<br>
  <b>v1.1.21 起整块按开关显隐</b>：上面的「桌面悬浮歌词」关着时，形态 / 宽度 / 位置 / 行数 / 字号 / 对齐 / 底板 / 暂停 / 颜色 / 歌名歌手 / 调整位置<b>一项都不显示</b>，只留开关与一行小字说明「打开后能调什么」。开着的功能不摆无效控件 —— 早先那种「关着也允许预设」的写法，用户调完退到桌面看不到变化，只会当成 bug。<br>
  <b>v1.1.29 尾部新增两行</b>（颜色之后、调整位置之前）：①「不显示悬浮窗的应用」——ActionRow 进名单弹窗（㉙F），副标题实时显示「已设 N 个应用；点开可增删」，带 ↺（清回空名单）；②「前台应用记录」——SwitchRow，默认关，副标题四态联动（记录+名单 / 只记录 / 只名单 / 全关），文案要把「记录关了但名单仍生效」这种中间态说清楚。两块共用免 adb 检测通道（无障碍服务为主、使用情况权限兜底），检测规范见 <code>docs/设计-悬浮窗按应用隐藏.md</code> 与 AI 开发指南 §11.15。<br>
  <b>v1.1.20 起「全屏高度」是独立的一套</b>：形态开关拨开后，这一段换成「全屏宽度 30–100%」+「水平位置（0 靠左 / 50 居中 / 100 靠右）」两个滑块，外加<b>靠左 / 居中 / 靠右三个 44dp 等宽按钮</b>；单条字幕的行数 / 宽度 / 自由拖动全部收进「全屏关」那一档。两套值分开落盘，互不污染。全屏这一档的桌面拖动<b>只跟横向</b>，双击浮层即锁定（全屏铺满整块屏，吃触摸时必须有桌面侧也能收工的手势）。<br>
  <b>宽度两端的两条口径</b>：①滑块范围就是 <b>1–100%</b>（用户要的语义），拖动时<b>逐帧</b>写回——宽度与屏宽是直接的比例关系，松手才变会让人以为「拖了半天没反应」，引擎每次都会重摆窗口，正好当实时预览用。②服务侧对像素宽度留了 <b>48dp 下限</b>（标准最小触控边长）：1% 在 1080p 屏上只有 10px，窗口会小到既看不见也拖不着。下限不能再往上抬——抬到 80dp 时，1080p / 3x 的机器上滑块 <b>1%~22% 全是同一个宽度</b>，低端那一整段等于失灵；48dp 把这段死区压到 13% 以内。</p>

  <b>格式识别的顺序必须是「文件名 → 路径 → MIME」</b>：MediaStore 的 MIME 常年写 <code>audio/mpeg</code>（连 <code>.m4a</code> 都可能这么报），先信 MIME 会把一半 FLAC 统计成 MP3，而且这个错误看起来完全合理。<br>
