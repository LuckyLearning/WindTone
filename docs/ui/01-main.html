<script>
/* 主题必须在样式之前定位，避免首帧闪错色：
   1) 用户手动切过 → 用记住的选择（localStorage）
   2) 没切过 → 跟随系统 prefers-color-scheme（App 也是跟随系统主题） */
(function(){
  try{
    var saved=localStorage.getItem('wt-ui-theme');
    var theme=saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme',theme);
  }catch(e){
    document.documentElement.setAttribute('data-theme','dark');
  }
})();
</script>

  <p class="note"><b>分组规则（v1.0.5 起，v1.0.7 强化）</b>：分组粒度 = <b>用户在系统文件选择器里挑中的那一层目录</b>，其下所有子目录的歌曲都归到这一组，子目录不再单独成组。<br>
  · <b>分组键（key）</b>：SAF 导入目录用<b>解码后的完整文档 ID</b>（如 <code>primary:Music/华语</code>），全盘扫描用绝对父路径 —— 两个不同位置的同名目录<b>各自成组，不会互相合并</b>；<br>
  · <b>组标题</b>：仍然只显示<b>最后一个文件夹名字</b>（<code>folderDisplayName()</code> 取路径最后一段）；当多个分组的叶名相同时，<b>副标题带父路径消歧</b>（如「Download/Music · 1,284 首」，见第二行示例）；<br>
  · <b>目录登记表</b>：每次扫描成功后把导入目录 upsert 进 Room 表 <code>scanned_folders</code>（自增 id / treeUri / docId / fullPath / name / addedAt），移除目录时同步删行 —— 这就是「按添加的目录显示、移除时目录一并移除」的数据基础；<br>
