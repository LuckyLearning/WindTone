<script>
/* 主题必须在样式之前定位，避免首帧闪错色：
   1) 用户手动切过 → 用记住的选择（localStorage）
   2) 没切过 → 跟随系统 prefers-color-scheme（App 也是跟随系统主题） */
(function(){
  try{
    var saved=localStorage.getItem('wt-ui-theme');
    var theme=saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme',theme);
  }catch(e){
    document.documentElement.setAttribute('data-theme','dark');
  }
})();
</script>

  <p class="note"><b>关键点：</b><b>限高 70% + 内部滚动</b>（2026-10-22 用户反馈：平板横屏上整层被顶到
  底部控制键底下、尾项看不见）——弹层内容最高占屏高 70%（<code>sheetMaxHeight()</code>，
  队列弹层 60%），超出的部分 <code>verticalScroll</code> 上下滚，不许弹层自己顶到近全屏；
  均衡器弹层（⑲）同一口径（原固定 560dp 已废除）。<b>玻璃底色整体提不透明度</b>（2026-10-22 用户反馈
  「透明度太高压不住底下内容」）：深色 .72 → <code>.90</code>、浅色 .66 → <code>.94</code>
  （<code>--glass-bg</code>，07-spec 已同步），玻璃感靠 <code>--glass-bd</code> 彩色描边维持。
  分组标题用 primary 加粗小标题（SectionLabel，上边距 18dp）；
  <b>速度与变调同组</b>（v1.1.6）——两者在播放器里是同一个 <code>PlaybackParameters</code>，
  界面上分开摆会让人以为互不影响（实际会互相覆盖，<code>setPlaybackSpeed</code> 内部就是
  <code>PlaybackParameters(speed, 1f)</code>，单调它会把变调打回原调）；<b>变调的单位是半音</b>
  （-12..+12，0 = 原调，±12 = 一个八度），持久化存半音、只在写进播放器那一刻由
  <code>playback/Pitch</code> 换成倍率——<code>0.89x</code> 没人看得懂，「降两个半音」一看就明白；
  歌词偏移逐曲保存（key = 歌曲），「重置」在偏移为 0 时禁用；导出默认文件名「{歌名}.lrc」；「当前歌曲 → 音频信息」与长按菜单打开同一个
  <code>SongInfoSheet</code>（见 ㉒）。<br>
  <b>「歌词」分组第一项是「桌面悬浮歌词」</b>：播放页顺手就能开关，不必钻进「设置 → 歌词」子页（功能再好，找不到就等于没有）。
  它是 <code>OptionRow</code>——左侧有图标、右侧只有选中 ✓（✓ = 已开启），未授权时点击会跳到系统「显示悬浮窗」授权页，
  授权返回后由 <code>MainActivity.onResume</code> 对账并自动打开开关。<br><b>行组件规范（防画错）</b>：底部弹层里的可点行是 <code>OptionRow</code>（Sheets*.kt）——<b>左侧有语义图标、右侧没有箭头</b>，唯一右侧元素是选中态的 ✓；设置页的可点行是 <code>ActionRow</code>（SettingsScreen.kt）——左侧没有图标（纯文字卡），<b>右侧可以有「当前值摘要」和右箭头</b>：摘要把状态前置（如「过滤 < 60 秒」），箭头只给<b>点开会进入另一个界面</b>的行（子页入口、打开弹层 / 弹窗的行），就地执行动作（「检查更新」）或就地展开（「查看日志」）的行不加。<b>v1.0.7 起「全 App 不存在 chevron」的规范放宽为「只有 ActionRow 能带 chevron」</b>，<code>OptionRow</code> 与其它地方仍然不画。</p>

  <p class="note"><b>关键点：</b>标题行右侧是总开关；设备不可用 / 播放器未启动时整片替换为提示「当前设备不可用或播放器尚未启动。开始播放任意一首歌曲后即可调节。」<br>
  <b>2026-10-22 起：五段＝决策顺序（方案 → 预设 → 曲线调频段 → 增强音效 → 播放过渡；2026-10-17 为三段）</b>。<br>
  &nbsp;&nbsp;① <b>方案（v1.1.52）</b>——<code>SoundSchemes</code> 八条一键包（曲线 + 低音 + 环绕 + 响度 + 混响打包），
  用户选的是「想要什么感觉」而不是参数；<b>应用方案即打开总开关</b>，微调任一参数 = 离开方案（id 清空，与预设同口径）。
  车载方案带「车载」标（供车载音效档案用，手机模式同样可选）。<br>
  &nbsp;&nbsp;⑤ <b>播放过渡（v1.1.52）</b>——淡入淡出（自动切歌生效，时长 0.5–6 秒，手动操作立即恢复）+
  音量平衡（按曲目 RMS <b>衰减</b>过响的歌；后台懒分析、按曲目缓存在应用私有目录，见 <code>TrackVolume</code> / <code>LoudnessScan</code> / <code>LoudnessCache</code>）。
  这两项走<b>播放器音量</b>而非音频效果器，<b>效果器建不出来的车机上也照常可用</b>，所以渲染在可用性判断之外。<br>
  &nbsp;&nbsp;另有<b>「按住对比原声」</b>按钮（总开关开着时出现）：按住期间全部效果器临时旁路（<code>AudioFx.setBypassed</code>），松手恢复，不碰任何落盘值。<br>
  &nbsp;&nbsp;① <b>预设</b>——「听感 / 流派」两组 tab + <b>自动换行</b>的预设网 + <b>选中项说明卡</b>（预设名 + 一句话，看描述就能做决定，不必懂频段）。
  原先是一组横向滚动 chips，一组 8 个片时最后两个永远在屏幕外，「有没有我想要的」本身就得靠滑一下才知道；换行之后整组一屏看全。
  听感组 8 个：原声 / 低音增强 / 高音增强 / 人声清晰 / 动感 / <b>温暖 / 明亮 / 通透</b>；
  流派组 8 个：流行 / 摇滚 / 古典 / 爵士 / <b>电子 / 民谣 / 嘻哈 / 舞曲</b>。
  <b>手动拖频段滑块 = 离开预设进入「自定义」</b>（预设 id 清空，说明卡随之换成「自定义」）。<br>
  &nbsp;&nbsp;② <b>频段</b>——先把当前曲线画出来（折线 + 零点虚线 + 折点圆点），再给频段滑块。曲线高度按<b>设备量程</b>归一化，
  <b>形状可信、绝对高度不代表真实增益</b>（真实数值看滑块右侧的 dB 标签）。每频段 = 频率标签（46dp）+ 滑块 + 带符号数值（如 <code>+5.5</code> / <code>0.0</code>）。<br>
  &nbsp;&nbsp;③ <b>增强音效</b>——低音 / 环绕 / 响度 / <b>混响</b>，见 ⑲B。<br>
  &nbsp;&nbsp;整页<b>可滚动</b>（内容上限 560dp），小屏上不会把底部几项挤出屏幕。<br>
  <b>预设体系（v1.1.5 起，参考三星 One UI 6.1.1）</b>：<b>不再用平台预设</b>
  （<code>Equalizer.usePreset</code> 的名字是英文、各 ROM 不一致、无法本地化），改为内置曲线
  <code>EqPresets</code>——每个预设给一组「锚点频率 → 增益」（60 / 230 / 910 / 3600 / 14000 Hz，五段机的中心频率正好就是这五个点），
  在 log 频率轴上对设备实际频段中心频率插值，5/6/10 段机器都能落到合理曲线上。
  预设 id 持久化在 <code>eq_preset_id</code>（String）；旧的平台预设索引 key <code>eq_preset</code>（Int）废弃不再读取。<br>
  <b>v1.1.4：标题行有 ↺</b>（在总开关左侧，与设置页同一条口径：<b>只在偏离出厂状态时出现</b>——开了开关、选了预设、任意频段非 0、四项增强有一项非默认才算偏离）。
  点一下写回 <code>AudioFx.reset()</code> = <b>关掉均衡器 + 频段全平 + 低音/环绕/响度归零 + 混响回到关闭</b>，也就是全新安装那份值
  （注意：恢复默认是「什么都没选过」的语义，显示「自定义 + 全平」，<b>不</b>停在「原声」预设上）。
  这里必须有这一枚：均衡器的值<b>没有对应的设置页行</b>（设置页那一行只是弹层入口），少了它整块参数就没有复位路径。</p>
</figure>
