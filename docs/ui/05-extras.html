<script>
/* 主题必须在样式之前定位，避免首帧闪错色：
   1) 用户手动切过 → 用记住的选择（localStorage）
   2) 没切过 → 跟随系统 prefers-color-scheme（App 也是跟随系统主题） */
(function(){
  try{
    var saved=localStorage.getItem('wt-ui-theme');
    var theme=saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme',theme);
  }catch(e){
    document.documentElement.setAttribute('data-theme','dark');
  }
})();
</script>

      <div style="margin:14px 14px 0;font-size:11.5px;line-height:1.7;color:var(--on-surface-variant)">
        通知栏样式由 Media3 默认模板生成：小图标 <b>ic_notification</b>、封面、标题（歌名）、副标题（歌手）；
        展开后有上一首 / 播放暂停 / 下一首 + 进度条。<br><br>
        <b>本应用不提供「把歌词显示在通知栏」的开关</b>：Media3 的通知正文只取 <code>artist</code>，
        要显示歌词就得覆盖 <code>artist</code>，而队列抽屉与桌面小组件也读它——贴上去会让那两处显示错信息。
        歌词的落点是<b>桌面悬浮歌词</b>（见 ㊴ 屏）与<b>播放页歌词</b>。

  <p class="note"><b>关键点：</b>应用没有任何自定义通知布局，全部走 MediaSessionService 默认样式；锁屏界面复用同一份媒体通知。<br>
  <b>曾经的弯路（别重走）</b>：v1.1.0 及以前有个「通知栏 / 锁屏显示歌词」开关，做法是把当前歌词行写进 <code>mediaItem.subtitle</code>；
  但反编译 <code>DefaultMediaNotificationProvider</code> 可见其 <code>getNotificationContentText()</code> 只有一句 <code>getfield artist</code>——
  写进 subtitle 的歌词<strong>永远看不见</strong>，那个开关从头到尾都是失效的。v1.1.1 用自定义 provider 改过取值顺序，后来（悬浮歌词可用之后）这个功能整体移除：
  通知栏那点宽度放歌词本来就难看，不如把精力放在悬浮字幕上。</p>

  <b>常用提示文案</b>（走同一组件）：<br>
  · 歌单：「已创建歌单「X」」「已删除歌单」「已加入歌单」「已导出「X」（N 首）」「无法读取 M3U 文件」<br>
  · 删除 / 移除：「已删除「X」」「删除「X」失败：存储拒绝了该操作」「已移除「X」的 N 首歌曲」「已移除全部目录，请重新选择扫描范围」<br>
  · 收藏 / 编辑：「已收藏「X」」「已取消收藏」「已更新歌曲信息（仅本应用内显示，不修改原文件）」<br>
  · 扫描 / 歌词：「已重新匹配歌词文件：N 首」「所选目录里没有找到音频文件」「扫描失败，请检查权限后重试」<br>
  · 权限：「没有读取音频的权限。可以改为「选择音乐目录」，用文件选择器授权指定文件夹。」<br>
  · 播放：「播放失败：X，已跳到下一首」「已加入播放队列：X」<br>
  · 统计 / 日志：「播放统计已清空（收藏保留）」「崩溃日志已清空」「崩溃日志已导出」「导出失败：X」<br>
  · 更新：更新相关的网络错误文案见设置页说明（仓库未发布 / 访问过于频繁 / 网络不可用 / 连接超时 / 下载包不完整 / 不是有效 APK 等）。</p>
