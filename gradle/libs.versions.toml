#
# Gradle Version Catalog —— 全仓「第三方依赖 + 构建插件」的唯一版本来源。
#
# 约定（改依赖前先读这一节）：
#   1. 版本号只写在 [versions]；库坐标只写在 [libraries]；插件坐标只写在 [plugins]。
#   2. build.gradle.kts 里一律写 `libs.xxx.yyy` 访问器，**任何地方都不再出现字面版本号**。
#      升级某个库 = 只改 [versions] 里对应那一行，所有引用点自动跟随。
#   3. Compose 全家桶的版本由 BOM 统一决定，因此 [libraries] 里**故意不写 version**
#      （写了反而会覆盖 BOM 的对齐结果）。同理，BOM 本身要用 platform(libs.…) 包一层。
#   4. 别名用 kebab-case；Gradle 会把它转成点号访问器：
#      `androidx-compose-ui-graphics` → `libs.androidx.compose.ui.graphics`。
#   5. 应用自身的版本号（versionName / versionCode）**不在本文件**，仍定义在
#      app/build.gradle.kts 顶部 —— 发版脚本与 CI 依赖那里的固定文本格式做解析。
#
# 新增一个依赖的完整步骤（详见 docs/AI开发指南.md §11.8）：
#   [versions] 加版本（若已有同类库可复用）→ [libraries] 加坐标 → build.gradle.kts 引用。
#

[versions]
# ── 构建工具链 ────────────────────────────────────────────────────────────────
# 与 gradle/wrapper/gradle-wrapper.properties 里的 Gradle 版本配套，一起升才安全：
#   AGP 8.7.x  ↔  Gradle 8.9  ↔  JDK 17 target（编译用 JDK 21 跑）
# ksp 版本号格式是「Kotlin 版本-ksp 版本」，**前半段必须与 kotlin 严格一致**。
agp = "8.7.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"

# ── AndroidX 基础 ────────────────────────────────────────────────────────────
androidxCore = "1.13.1"
androidxActivity = "1.9.3"
androidxLifecycle = "2.8.7"
androidxDocumentfile = "1.0.1"

# ── Compose ──────────────────────────────────────────────────────────────────
composeBom = "2024.10.01"

# ── 媒体播放 ─────────────────────────────────────────────────────────────────
media3 = "1.4.1"

# ── 数据与通用工具 ───────────────────────────────────────────────────────────
room = "2.6.1"
pinyin4j = "2.5.1"
coroutines = "1.8.1"
guava = "33.0.0-android"

# ── 测试 ─────────────────────────────────────────────────────────────────────
junit = "4.13.2"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"

[libraries]
# ── AndroidX 基础 ──
# 注意：appcompat **故意不在依赖里**（2026-10-15 清理）。主题继承的是框架主题
# `android:Theme.Material.Light.NoActionBar`，全工程 0 处 AppCompat 引用 ——
# 它从项目第一天就是多余的，白背一份 AppCompat + fragment 的类与资源。
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "androidxDocumentfile" }

# ── Lifecycle / ViewModel（四个分域 ViewModel 依赖它）──
# lifecycle-service 同样已删：全工程没有一个 LifecycleService 子类，
# 播放服务是 media3 的 MediaSessionService（自己实现 LifecycleOwner）。
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

# ── Compose（版本一律交给 BOM，见文件头约定 3）──
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# Compose UI 冒烟测试：能跑在 JVM 单测里（配 Robolectric），不需要模拟器 ——
# ui-test-manifest 提供 ComponentActivity 声明，ui-test-junit4 提供 createComposeRule()。
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# ── Media3（播放服务 / 会话 / 公共 API）──
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# ── Room（运行时 + 协程扩展 + KSP 注解处理器）──
# room-compiler 走 ksp(...) 配置，**不是 kapt**。
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ── 通用工具 ──
pinyin4j = { group = "com.belerweb", name = "pinyin4j", version.ref = "pinyin4j" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

# ── 单元测试 ──
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Robolectric + androidx.test:core：让 Room（真实 SQLite）能在 JVM 单测里跑
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Kotlin 2.0 起 Compose 编译器随 Kotlin 版本走，必须显式应用这个插件
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
